server {
    listen 80;
    server_name _;
    root /app;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max file upload size
    client_max_body_size 100M;

    # Disable access to sensitive files
    location ~ /\.ht {
        deny all;
    }

    location ~ /\.(git|svn) {
        deny all;
    }

    # Block access to configuration files
    location ~ ^/(app/config|app/cache|app/logs|app/tmp|config|docker) {
        deny all;
    }

    # Block access to vendor directory
    location ~ ^/vendor {
        deny all;
    }

    # Block access to composer files
    location ~ composer\.(json|lock) {
        deny all;
    }

    # Media and static files
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Mautic tracking pixel - high performance
    location = /mtracking.gif {
        try_files $uri /index.php$is_args$args;
    }

    # Handle Mautic specific URLs
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Pretend HTTPS is on
        fastcgi_param HTTPS "on";
        fastcgi_param HTTP_X_FORWARDED_PROTO "https";
        fastcgi_param HTTP_X_FORWARDED_PORT "443";
        fastcgi_param SERVER_PORT "443";

        # FastCGI parameters
        include fastcgi_params;

        # Increase timeouts for Mautic operations
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;

        # Buffer settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Logging - output to Docker container stdout/stderr
    error_log /dev/stderr warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}